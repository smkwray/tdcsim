[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdcsim"
version = "0.1.0"
description = "Accounting-consistent Treasury funding and deposit-component scenario simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas>=3.0.3",
  "python-dateutil",
  "PyYAML",
  "scipy",
]

[project.scripts]
tdcsim-cbo = "tdcsim_cbo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["tdcsim_cbo", "tdcsim_cbo.schemas", "tdcsim_cbo.transforms"]
py-modules = [
  "bill_quote_basis",
  "budget_interest",
  "cbo_holder_preferences",
  "cbo_policy_bundle",
  "cbo_yield_curve_surface",
  "contract_validation",
  "csv_gen",
  "debt_targeting",
  "evaluated_nominal_curve",
  "fed_purchase_policy",
  "forecast_bundle_builders",
  "forecast_input_builder",
  "forecast_paths",
  "frn_indexation",
  "funding_plan",
  "historical_replay",
  "historical_replay_auction",
  "historical_replay_contract",
  "historical_replay_event_ledger",
  "historical_replay_interest",
  "historical_replay_loader",
  "historical_replay_materializer",
  "historical_replay_observations",
  "historical_replay_pricing",
  "historical_replay_solver",
  "historical_replay_soma",
  "historical_replay_tdc",
  "historical_replay_tdc_inputs",
  "historical_replay_tdcest",
  "holder_mapping",
  "holder_targets",
  "issuance_calibration",
  "quarterly_aggregation",
  "ratewall_assumption_mode_schema",
  "ratewall_contract",
  "ratewall_marginal_tdc_contract",
  "ratewall_input_builder",
  "ratewall_paths",
  "route_component_support_registry",
  "settlement_routes",
  "sim_engine",
  "sim_groups",
  "sim_helpers",
  "sim_plotting",
  "sim_pricing",
  "sim_trading",
  "simulation_calendar",
  "simulation_core",
  "tdc_shared",
  "tdc_validation",
  "tips_indexation",
  "yield_curve_path",
]

[tool.setuptools.package-data]
tdcsim_cbo = ["schemas/*.json"]

# These entry points put the source checkout on sys.path before importing it.
[tool.ruff.lint.per-file-ignores]
"scripts/run_cbo_forecast_smoke.py" = ["E402"]
"scripts/run_cbo_scenario.py" = ["E402"]
"scripts/verify_cbo_scenario_run.py" = ["E402"]
"tests/test_cbo_forecast_runner.py" = ["E402"]
"tests/test_cbo_package_verifier.py" = ["E402"]
